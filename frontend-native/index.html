<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DREAM - Discover Your Next Favorite Show</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: #1a1612;
            color: #f5f1e8;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }
        
        #app {
            min-height: 100vh;
            width: 100%;
        }
        
        /* Loading state sebelum Vue mount */
        #app:empty {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 18px;
            color: #d8a0a5;
            background: #1a1612;
        }
        
        #app:empty::before {
            content: 'Loading DREAM...';
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        /* Fallback styles jika Vue gagal load */
        .fallback-content {
            display: none;
        }
        
        .no-js #app,
        .vue-error #app {
            display: none;
        }
        
        .no-js .fallback-content,
        .vue-error .fallback-content {
            display: block;
            padding: 20px;
            text-align: center;
        }
        
        .fallback-nav {
            background: #2a2520;
            padding: 15px 0;
            margin-bottom: 20px;
        }
        
        .fallback-nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .fallback-nav li {
            display: inline-block;
        }
        
        .fallback-nav a {
            text-decoration: none;
            color: #f5f1e8;
            padding: 10px 20px;
            border-radius: 25px;
            transition: all 0.3s ease;
            font-weight: 500;
            background: rgba(216, 160, 165, 0.1);
        }
        
        .fallback-nav a:hover {
            background: #d8a0a5;
            color: #1a1612;
            transform: translateY(-2px);
        }
        
        .fallback-content h1 {
            color: #d8a0a5;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .fallback-content p {
            color: #b8b4a9;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        
        /* Error message styling */
        .error-message {
            background: #2a2520;
            border-left: 4px solid #d8a0a5;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Vue app akan di-render di sini -->
    </div>
    
    <!-- Fallback content jika JavaScript dinonaktifkan atau Vue gagal load -->
    <div class="fallback-content">
        <nav class="fallback-nav">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#movies">Movies</a></li>
                <li><a href="#celebs">Celebs</a></li>
                <li><a href="#breaking">Breaking</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
        
        <div class="fallback-main">
            <h1>DREAM</h1>
            <p>Discover Your Next Favorite Show</p>
            
            <div class="error-message">
                <h3>JavaScript Required</h3>
                <p>Please enable JavaScript to experience DREAM fully, or check if there's an error in the console.</p>
                <p><small>Press F12 and check the Console tab for any error messages.</small></p>
            </div>
        </div>
    </div>

    <script>
        // Error handling untuk Vue
        window.addEventListener('error', function(e) {
            console.error('Application error:', e.error);
            document.body.classList.add('vue-error');
        });
        
        // Fallback untuk no JavaScript
        document.body.classList.add('no-js');
        document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.remove('no-js');
        });
        
        // Timeout fallback jika Vue loading terlalu lama
        setTimeout(function() {
            if (document.querySelector('#app').children.length === 0) {
                console.warn('Vue app taking too long to load, showing fallback');
                document.body.classList.add('vue-error');
            }
        }, 5000);
    </script>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
